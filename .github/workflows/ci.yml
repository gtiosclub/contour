name: CI

# The repo is public, so GitHub-hosted runners (macOS included) are free.
# Every PR runs the isolation check on Linux and one combined macOS job that
# tests every package and builds both apps. Red CI, no merge.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # An exact release, not a major. The xcode-27 image also carries 27.1 and 27.2,
  # both betas, and a bare "27" glob sorts a beta to the top.
  XCODE_VERSION: "27.0"

jobs:
  # Every PR. Free. Catches the one mistake that actually hurts: a team
  # reaching into another team's package.
  isolation:
    name: Package isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./Scripts/check-dependencies.sh

  # One Mac job: test every package, then build both app targets.
  mac:
    name: build + test
    # GitHub preview image. The GA macos-26 image has no Xcode 27 at all.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Fail if the pinned Xcode is missing. Falling back to whatever the
          # image defaults to would build on the wrong toolchain and still go green.
          app="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$app" ]; then
            echo "::error::$app is not on this runner. Installed:"
            ls -d /Applications/Xcode_*.app
            exit 1
          fi
          sudo xcode-select -s "$app"
          xcodebuild -version
          swift --version

      - name: swift test — all packages
        run: |
          set -e
          for pkg in ContourCore ContourMocks SurfaceUnderstanding Tracking ContourFeedback ContourUI; do
            echo "::group::$pkg"
            (cd "Packages/$pkg" && swift test)
            echo "::endgroup::"
          done

      - name: Build ContourApp
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Contour.xcworkspace \
            -scheme ContourApp \
            -destination "generic/platform=iOS Simulator" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Test manual reference setup
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Contour.xcworkspace \
            -scheme ContourApp \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=27.0" \
            -only-testing:ContourTests/ManualPanelReferenceTests \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Harness
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Contour.xcworkspace \
            -scheme Harness \
            -destination "platform=macOS" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
