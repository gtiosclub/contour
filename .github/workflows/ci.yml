name: CI

# macOS runners cost 10x against the org's free Actions minutes and we ran out
# in week one. So: the cheap check runs on every PR on Linux, and the real
# build/test runs on a Mac only when a lead triggers it by hand.
#
# The gate for merging is `swift test` on your own machine. The PR template
# asks which package you ran it in. Don't lie on the template.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "26"

jobs:
  # Every PR. Free. Catches the one mistake that actually hurts: a team
  # reaching into another team's package.
  isolation:
    name: Package isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./Scripts/check-dependencies.sh

  # Manual only: Actions tab → CI → Run workflow. One Mac job instead of nine.
  # Builds and tests every package, then builds both app targets.
  mac:
    name: build + test (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          app=$(ls -d /Applications/Xcode_${XCODE_VERSION}*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$app" ]; then sudo xcode-select -s "$app"; fi
          xcodebuild -version
          swift --version

      - name: swift test — all packages
        run: |
          set -e
          for pkg in ContourCore ContourMocks SurfaceUnderstanding Tracking ContourFeedback ContourUI; do
            echo "::group::$pkg"
            (cd "Packages/$pkg" && swift test)
            echo "::endgroup::"
          done

      - name: Build ContourApp
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Contour.xcworkspace \
            -scheme ContourApp \
            -destination "generic/platform=iOS Simulator" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Harness
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Contour.xcworkspace \
            -scheme Harness \
            -destination "platform=macOS" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
